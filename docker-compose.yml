version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: proyecto_db
    environment:
      POSTGRES_USER: usuario_dev
      POSTGRES_PASSWORD: password_dev
      POSTGRES_DB: proyecto_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: proyecto_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=usuario_dev
      - DB_PASSWORD=password_dev
      - DB_NAME=proyecto_db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: proyecto_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  pgdata: